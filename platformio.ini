; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Varsayilan OTA (Upload tusuna basinca auth+IP dogru gider)
; USB icin alt bardan "esp32c3_super_mini" secin
default_envs = esp32c3_super_mini_ota

; USB ile yukleme
[env:esp32c3_super_mini]
platform = espressif32@5.4.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

upload_protocol = esptool
upload_port = COM7
monitor_port = COM7
upload_speed = 460800
; upload_flags burada yok — IP ile yanlislikla OTA yapilirsa espota bozulmasin

board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.9
    tzapu/WiFiManager@^2.0.17

; WiFi OTA (varsayilan ortam) | Sifre: 1234 — IP'yi ekrandaki adresle guncelleyin
[env:esp32c3_super_mini_ota]
extends = env:esp32c3_super_mini
upload_protocol = espota
upload_port = 192.168.1.14
monitor_port = COM7
upload_flags =
    --auth=1234
    --timeout=120
    --progress
