; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; USB yukleme: esp32s3_super_mini (varsayilan)
; WiFi OTA: esp32s3_super_mini_ota — once WiFi bagli, IP'yi ana ekrandan alin
; OTA sifre: 1234 | hostname: sp_dashboard.local
default_envs = esp32s3_super_mini

; --- ESP32-S3 Super Mini (4MB + 2MB PSRAM — tipik nologo kart) ---
; board=devkitc-1 DEGIL: o kart 8MB, PSRAM yok profili — yanlis ayar boot dongusu yapar
[env:esp32s3_super_mini]
platform = espressif32@5.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

upload_protocol = esptool
upload_port = COM8
monitor_port = COM8
upload_speed = 921600
monitor_rts = 0
monitor_dtr = 0
; upload_flags burada YOK — IP ile yuklemede espota'ya --before gider (hata)
; USB: normal Upload | WiFi OTA: esp32s3_super_mini_ota ortamini secin

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.9
    tzapu/WiFiManager@^2.0.17
    adafruit/Adafruit NeoPixel@^1.12.0

; --- 16MB flash + 8MB PSRAM (modul: ESP32-S3-WROOM-1-N16R8) ---
[env:esp32s3_super_mini_16mb]
extends = env:esp32s3_super_mini
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; WiFi OTA — PlatformIO alt bardan BU ortami secin (sadece IP yazmak yetmez)
; Sifre: 1234 | IP: ana ekran sol alt
[env:esp32s3_super_mini_ota]
extends = env:esp32s3_super_mini
upload_protocol = espota
upload_port = 192.168.1.25
monitor_port = COM8
extra_scripts = post:extra_scripts/ota_reset.py
upload_flags =
    --auth=1234
    --port=3232
    --timeout=120
    --progress

[env:esp32s3_super_mini_16mb_ota]
extends = env:esp32s3_super_mini_16mb
upload_protocol = espota
upload_port = 192.168.1.25
monitor_port = COM8
upload_flags =
    --auth=1234
    --port=3232
    --timeout=120
    --progress

; --- ESP32-C3 Super Mini (yedek / eski kart) ---
[env:esp32c3_super_mini]
platform = espressif32@5.4.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

upload_protocol = esptool
upload_port = COM7
monitor_port = COM7
upload_speed = 460800

board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.9
    tzapu/WiFiManager@^2.0.17

[env:esp32c3_super_mini_ota]
extends = env:esp32c3_super_mini
upload_protocol = espota
upload_port = 192.168.1.25
monitor_port = COM7
upload_flags =
    --auth=1234
    --port=3232
    --timeout=120
    --progress
